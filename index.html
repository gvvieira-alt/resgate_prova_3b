<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:,">
  <title></title>
  
  <style>
    /* Interface Bonita (Melhoria PLUS) */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f0f2f5; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 40px; 
    }
    h1 { color: #1c1e21; margin-bottom: 20px; }
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      cursor: pointer; 
      background-color: #007bff; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      transition: background 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover { background-color: #0056b3; }
    #lista { 
      list-style: none; 
      padding: 0; 
      margin-top: 30px; 
      width: 100%; 
      max-width: 500px; 
    }
    #lista li { 
      background: white; 
      margin-bottom: 12px; 
      padding: 15px; 
      border-radius: 10px; 
      border-left: 6px solid #007bff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <h1>Buscar Dados</h1>
  <button onclick="buscarDados()">Buscar Postagens</button>

  <ul id="lista"></ul>

  <script>
  function buscarDados(){
    
    fetch("https://jsonplaceholder.typicode.com/posts")
      .then(res => res.json())
      .then(dados => {
        let lista = document.getElementById("lista")
        
        lista.innerHTML = dados.slice(0, 10).map(item => `
          <li>
            <strong>Título:</strong> ${item.title}
          </li>
        `).join('')
      })
      .catch(err => {
        console.error("Erro na busca:", err);
        alert("Erro ao carregar dados. Verifique sua internet!");
      })
  }
  </script>

</body>
</html>
